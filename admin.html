<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cork Temple - Moderator Desk</title>
    <style>
      :root {
        --primary: #8b0000;
        --success: #28a745;
        --danger: #dc3545;
        --bg: #f4f6f9;
        --card: #ffffff;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg);
        margin: 0;
        padding: 12px;
        color: #333;
      }
      .container { max-width: 650px; margin: 0 auto; }
      
      .header {
        background: var(--card);
        padding: 16px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        text-align: center;
        margin-bottom: 16px;
      }
      .header h2 { margin: 0 0 4px 0; color: var(--primary); font-size: 20px; }
      .header p { margin: 0; color: #666; font-size: 13px; }

      /* Login Card */
      .card {
        background: var(--card);
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        margin-bottom: 16px;
      }
      label { display: block; font-weight: 600; font-size: 13px; margin-top: 12px; margin-bottom: 4px; }
      input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
      .btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        margin-top: 16px;
      }
      .btn-primary { background: var(--primary); color: white; }
      .btn-success { background: var(--success); color: white; width: 48%; }
      .btn-danger { background: var(--danger); color: white; width: 48%; }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }

      /* Pending Queue Card */
      .item-card {
        background: var(--card);
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        margin-bottom: 16px;
        overflow: hidden;
        box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      }
      .thumb-box {
        width: 100%;
        height: 240px;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .thumb-box img { width: 100%; height: 100%; object-fit: contain; }
      .thumb-box video { width: 100%; height: 100%; object-fit: contain; }
      
      .item-details { padding: 14px; font-size: 13px; line-height: 1.5; }
      .badge {
        display: inline-block;
        background: #f0f0f0;
        padding: 3px 8px;
        border-radius: 4px;
        font-weight: 600;
        color: var(--primary);
        margin-bottom: 6px;
      }
      .item-actions {
        display: flex;
        justify-content: space-between;
        padding: 10px 14px 14px 14px;
        background: #fafafa;
        border-top: 1px solid #eee;
      }
      .status-text { text-align: center; padding: 20px; color: #777; font-size: 14px; }
      .user-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        margin-bottom: 12px;
        padding: 0 4px;
      }
      .logout-link { color: var(--primary); font-weight: bold; text-decoration: none; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>Cork Hindu Temple</h2>
        <p>Moderator Desk (Mobile Edition)</p>
      </div>

      <!-- Login Section -->
      <div id="loginSection" class="card">
        <form onsubmit="handleLogin(event)">
          <label for="adminEmail">Moderator Email Address</label>
          <input type="email" id="adminEmail" placeholder="e.g. devotee@gmail.com" required>

          <label for="adminPin">Moderator Security PIN</label>
          <input type="password" id="adminPin" placeholder="Enter your secret PIN" required inputmode="numeric">

          <button type="submit" id="loginBtn" class="btn btn-primary">Unlock Moderation Desk</button>
          <div id="loginMsg" style="color:red; font-size:13px; text-align:center; margin-top:10px;"></div>
        </form>
      </div>

      <!-- Desk Section (Hidden initially) -->
      <div id="deskSection" style="display:none;">
        <div class="user-bar">
          <span id="welcomeText"></span>
          <span class="logout-link" onclick="handleLogout()">Log Out</span>
        </div>

        <div id="loadingMsg" class="status-text">Checking for pending uploads...</div>
        <div id="queueList"></div>
      </div>
    </div>

    <script>
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyX9p_7vP1b5Hizl2KiRlE4tOo5XhtX3dGkB_JqbhWJEDlCf00AeXSIR2PZM_y3y6h3/exec";
      const UPLOAD_TOKEN = "CorkTempleSecureToken2026";

      let sessionEmail = localStorage.getItem("cork_mod_email") || "";
      let sessionPin = localStorage.getItem("cork_mod_pin") || "";

      window.onload = function() {
        if (sessionEmail && sessionPin) {
          document.getElementById("adminEmail").value = sessionEmail;
          document.getElementById("adminPin").value = sessionPin;
          executeLogin(sessionEmail, sessionPin);
        }
      };

      async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById("adminEmail").value.trim();
        const pin = document.getElementById("adminPin").value.trim();
        await executeLogin(email, pin);
      }

      async function executeLogin(email, pin) {
        const btn = document.getElementById("loginBtn");
        const msg = document.getElementById("loginMsg");
        btn.disabled = true;
        btn.textContent = "Verifying...";
        msg.textContent = "";

        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              token: UPLOAD_TOKEN,
              action: "adminLogin",
              email: email,
              pin: pin
            })
          });

          const data = await res.json();
          if (data.success) {
            sessionEmail = email;
            sessionPin = pin;
            localStorage.setItem("cork_mod_email", email);
            localStorage.setItem("cork_mod_pin", pin);

            document.getElementById("loginSection").style.display = "none";
            document.getElementById("deskSection").style.display = "block";
            document.getElementById("welcomeText").textContent = "Logged in: " + email;

            renderQueue(data.pendingItems || []);
          } else {
            msg.textContent = data.message || "Invalid email or PIN.";
          }
        } catch (err) {
          msg.textContent = "Connection error. Please try again.";
        } finally {
          btn.disabled = false;
          btn.textContent = "Unlock Moderation Desk";
        }
      }

      function handleLogout() {
        localStorage.removeItem("cork_mod_email");
        localStorage.removeItem("cork_mod_pin");
        sessionEmail = "";
        sessionPin = "";
        document.getElementById("deskSection").style.display = "none";
        document.getElementById("loginSection").style.display = "block";
        document.getElementById("adminPin").value = "";
      }

      function renderQueue(items) {
        const queueList = document.getElementById("queueList");
        const loadingMsg = document.getElementById("loadingMsg");
        queueList.innerHTML = "";

        if (!items || items.length === 0) {
          loadingMsg.textContent = "🎉 No pending uploads right now. All caught up!";
          loadingMsg.style.display = "block";
          return;
        }

        loadingMsg.style.display = "none";

        items.forEach(item => {
          const isVideo = /\.(mp4|mov|webm)$/i.test(item.fileName);
          const card = document.createElement("div");
          card.className = "item-card";
          card.id = "card-" + item.fileId;

          let preview = isVideo 
            ? `<div class="thumb-box"><video src="${item.fullUrl}" controls preload="metadata"></video></div>`
            : `<div class="thumb-box"><img src="${item.thumbnailUrl}" loading="lazy" onerror="this.src='${item.fallbackThumbUrl}'"></div>`;

          card.innerHTML = `
            ${preview}
            <div class="item-details">
              <span class="badge">${item.festival}</span>
              <div><strong>Devotee:</strong> ${item.devotee}</div>
              <div><strong>Phone:</strong> <a href="tel:${item.phone}">${item.phone}</a></div>
              <div><strong>Email:</strong> ${item.email}</div>
              <div><strong>Uploaded:</strong> ${item.timestamp}</div>
              <div style="font-size:11px; color:#888; margin-top:4px; word-break:break-all;">${item.fileName}</div>
            </div>
            <div class="item-actions">
              <button class="btn btn-danger" onclick="submitDecision('${item.fileId}', ${item.rowIndex}, 'REJECT')">✕ Reject</button>
              <button class="btn btn-success" onclick="submitDecision('${item.fileId}', ${item.rowIndex}, 'APPROVE')">✓ Approve</button>
            </div>
          `;
          queueList.appendChild(card);
        });
      }

      async function submitDecision(fileId, rowIndex, action) {
        if (!confirm(`Are you sure you want to ${action} this item?`)) return;

        const card = document.getElementById("card-" + fileId);
        const actionButtons = card.querySelectorAll("button");
        actionButtons.forEach(b => b.disabled = true);

        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              token: UPLOAD_TOKEN,
              action: "moderate",
              fileId: fileId,
              rowIndex: rowIndex,
              modAction: action,
              email: sessionEmail,
              pin: sessionPin
            })
          });

          const data = await res.json();
          if (data.success) {
            card.style.transition = "0.3s";
            card.style.opacity = "0.3";
            setTimeout(() => {
              card.remove();
              if (document.querySelectorAll(".item-card").length === 0) {
                renderQueue([]);
              }
            }, 300);
          } else {
            alert("Error: " + data.message);
            actionButtons.forEach(b => b.disabled = false);
          }
        } catch (err) {
          alert("Action failed: Connection error");
          actionButtons.forEach(b => b.disabled = false);
        }
      }
    </script>
  </body>
</html>
