<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cork Temple - Media Moderation</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f6f9; color: #333; }
      header { background-color: #8b0000; color: white; padding: 18px 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
      header h1 { margin: 0; font-size: 20px; }
      .header-meta { display: flex; align-items: center; gap: 12px; font-size: 13px; }
      .user-badge { background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 4px; }
      .logout-btn { background: white; color: #8b0000; border: none; padding: 4px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
      .header-links a { color: white; text-decoration: none; font-size: 13px; border: 1px solid white; padding: 5px 12px; border-radius: 4px; }
      .container { max-width: 1200px; margin: 25px auto; padding: 0 20px; }
      
      /* Login Dialog */
      .login-card { max-width: 420px; margin: 60px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
      .login-card h2 { color: #8b0000; margin-top: 0; text-align: center; }
      .login-card p { font-size: 14px; color: #666; text-align: center; }
      .login-card label { display: block; margin-top: 15px; font-weight: bold; font-size: 13px; }
      .login-card input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
      .login-btn { width: 100%; margin-top: 22px; padding: 12px; background: #8b0000; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 15px; cursor: pointer; }
      .login-btn:disabled { background: #ccc; }
      #loginError { color: #c62828; margin-top: 12px; font-size: 13px; text-align: center; }

      .status-banner { background: #fff; padding: 15px 20px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
      .card { background: white; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; transition: opacity 0.3s; }
      .preview-box { width: 100%; height: 220px; background-color: #e9ecef; position: relative; display: flex; align-items: center; justify-content: center; }
      .preview-box img { width: 100%; height: 100%; object-fit: cover; }
      .preview-hint { position: absolute; bottom: 6px; right: 8px; background: rgba(0,0,0,0.6); color: white; font-size: 11px; padding: 3px 6px; border-radius: 3px; }
      .meta { padding: 14px; flex-grow: 1; font-size: 13px; line-height: 1.5; }
      .meta strong { color: #8b0000; }
      .actions { display: flex; border-top: 1px solid #eee; }
      .btn { flex: 1; padding: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.2s; }
      .btn-approve { background-color: #2e7d32; color: white; }
      .btn-approve:hover { background-color: #1b5e20; }
      .btn-reject { background-color: #c62828; color: white; }
      .btn-reject:hover { background-color: #8e0000; }
      .btn:disabled { background-color: #ccc; cursor: not-allowed; }
      
      #emptyNotice { text-align: center; padding: 60px 20px; background: white; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); font-size: 16px; color: #666; }
    </style>
  </head>
  <body>
    <!-- Login Screen -->
    <div id="loginScreen" class="container" style="display: none;">
      <div class="login-card">
        <h2>Cork Temple Moderation</h2>
        <p>Enter your authorized committee email and PIN to manage uploads.</p>
        <form onsubmit="handleLogin(event)">
          <label for="loginEmail">Moderator Email:</label>
          <input type="email" id="loginEmail" placeholder="e.g. volunteer@gmail.com" required>

          <label for="loginPin">Moderator PIN:</label>
          <input type="password" id="loginPin" placeholder="Enter PIN from sheet" required>

          <button type="submit" id="loginBtn" class="login-btn">Log In</button>
          <div id="loginError"></div>
        </form>
      </div>
    </div>

    <!-- Moderation Dashboard Screen -->
    <div id="dashboardScreen" style="display: none;">
      <header>
        <h1>Cork Temple - Media Moderation Desk</h1>
        <div class="header-meta">
          <span class="user-badge">Moderator: <strong id="activeUserDisplay"></strong></span>
          <button class="logout-btn" onclick="handleLogout()">Log Out</button>
          <div class="header-links">
            <a href="gallery.html">Live Gallery</a>
            <a href="index.html">Upload Form</a>
          </div>
        </div>
      </header>

      <div class="container">
        <div class="status-banner">
          <div><strong>Pending Moderation:</strong> <span id="pendingCount">Loading...</span></div>
          <button onclick="refreshQueue()" style="padding: 6px 14px; cursor: pointer; border: 1px solid #ccc; border-radius: 4px; background: white;">Refresh List</button>
        </div>

        <div id="grid" class="grid"></div>
        <div id="emptyNotice" style="display: none;">🎉 No items waiting for moderation. Everything is reviewed!</div>
      </div>
    </div>

    <script>
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyX9p_7vP1b5Hizl2KiRlE4tOo5XhtX3dGkB_JqbhWJEDlCf00AeXSIR2PZM_y3y6h3/exec";
      const UPLOAD_SECRET = "CorkTempleSecureToken2026";

      let currentModeratorEmail = localStorage.getItem("cork_mod_email") || "";
      let currentModeratorPin = localStorage.getItem("cork_mod_pin") || "";

      window.onload = function() {
        if (currentModeratorEmail && currentModeratorPin) {
          attemptAuth(currentModeratorEmail, currentModeratorPin, true);
        } else {
          showLogin();
        }
      };

      function showLogin() {
        document.getElementById('loginScreen').style.display = "block";
        document.getElementById('dashboardScreen').style.display = "none";
      }

      function showDashboard(email, items) {
        document.getElementById('loginScreen').style.display = "none";
        document.getElementById('dashboardScreen').style.display = "block";
        document.getElementById('activeUserDisplay').textContent = email;
        renderCards(items);
      }

      function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const pin = document.getElementById('loginPin').value.trim();
        attemptAuth(email, pin, false);
      }

      async function callBackend(payload) {
        payload.token = UPLOAD_SECRET;
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        return await res.json();
      }

      async function attemptAuth(email, pin, isSilent) {
        const btn = document.getElementById('loginBtn');
        const err = document.getElementById('loginError');
        if (btn) btn.disabled = true;
        if (err) err.textContent = isSilent ? "" : "Verifying credentials...";

        try {
          const res = await callBackend({
            action: "adminLogin",
            email: email,
            pin: pin
          });

          if (btn) btn.disabled = false;
          if (res.success) {
            currentModeratorEmail = res.email;
            currentModeratorPin = pin;
            localStorage.setItem("cork_mod_email", res.email);
            localStorage.setItem("cork_mod_pin", pin);
            if (err) err.textContent = "";
            showDashboard(res.email, res.pendingItems);
          } else {
            if (isSilent) {
              showLogin();
            } else {
              if (err) err.textContent = res.message || "Invalid credentials.";
            }
          }
        } catch (error) {
          if (btn) btn.disabled = false;
          if (err) err.textContent = "Server error: " + error.message;
          if (isSilent) showLogin();
        }
      }

      function handleLogout() {
        localStorage.removeItem("cork_mod_email");
        localStorage.removeItem("cork_mod_pin");
        currentModeratorEmail = "";
        currentModeratorPin = "";
        showLogin();
      }

      async function refreshQueue() {
        document.getElementById('pendingCount').textContent = "Checking...";
        try {
          const res = await callBackend({
            action: "getPending",
            email: currentModeratorEmail,
            pin: currentModeratorPin
          });
          if (res.success) {
            renderCards(res.pendingItems);
          } else {
            alert("Error: " + (res.message || "Could not fetch items"));
          }
        } catch (err) {
          alert("Error: " + err.message);
        }
      }

      function renderCards(items) {
        const countSpan = document.getElementById('pendingCount');
        const grid = document.getElementById('grid');
        const empty = document.getElementById('emptyNotice');

        items = items || [];
        countSpan.textContent = items.length + " item(s)";

        if (items.length === 0) {
          empty.style.display = "block";
          grid.innerHTML = "";
          return;
        }

        empty.style.display = "none";
        grid.innerHTML = "";

        items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.id = 'card-' + item.fileId;

          card.innerHTML = `
            <div class="preview-box">
              <a href="${item.fullUrl}" target="_blank" title="Click to open full file in Drive" style="width: 100%; height: 100%; display: block;">
                <img 
                  src="${item.thumbnailUrl}" 
                  alt="${item.fileName}" 
                  onerror="this.onerror=null; this.src='${item.fallbackThumbUrl}';"
                >
              </a>
              <span class="preview-hint">Click image to enlarge</span>
            </div>
            <div class="meta">
              <div><strong>Festival:</strong> ${item.festival}</div>
              <div><strong>Devotee:</strong> ${item.devotee}</div>
              <div><strong>Email:</strong> ${item.email}</div>
              <div><strong>Phone:</strong> ${item.phone}</div>
              <div><strong>File:</strong> ${item.fileName}</div>
              <div><strong>Uploaded:</strong> ${item.timestamp}</div>
            </div>
            <div class="actions">
              <button class="btn btn-reject" onclick="handleDecision('${item.fileId}', ${item.rowIndex}, 'REJECT')">✕ Reject</button>
              <button class="btn btn-approve" onclick="handleDecision('${item.fileId}', ${item.rowIndex}, 'APPROVE')">✓ Approve</button>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      async function handleDecision(fileId, rowIndex, action) {
        const card = document.getElementById('card-' + fileId);
        const buttons = card.querySelectorAll('button');
        buttons.forEach(b => b.disabled = true);
        card.style.opacity = '0.5';

        try {
          const res = await callBackend({
            action: "moderate",
            fileId: fileId,
            rowIndex: rowIndex,
            modAction: action,
            email: currentModeratorEmail,
            pin: currentModeratorPin
          });

          if (res.success) {
            card.remove();
            const remaining = document.querySelectorAll('.card').length;
            document.getElementById('pendingCount').textContent = remaining + " item(s)";
            if (remaining === 0) {
              document.getElementById('emptyNotice').style.display = "block";
            }
          } else {
            alert("Operation failed: " + res.message);
            card.style.opacity = '1';
            buttons.forEach(b => b.disabled = false);
          }
        } catch (err) {
          alert("Error: " + err.message);
          card.style.opacity = '1';
          buttons.forEach(b => b.disabled = false);
        }
      }
    </script>
  </body>
</html>
